<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark light">
<title>Анонимки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Literata:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #262624;
  --surface: #30302e;
  --raised: #3b3a37;
  --line: #4a4843;
  --text: #faf9f5;
  --muted: #a8a69c;
  --accent: #d97757;
  --on-accent: #1f1e1d;
  --danger: #ef8a7e;
  --scrim: rgba(20, 20, 19, .6);
  --serif: "Literata", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #faf9f5;
  --surface: #ffffff;
  --raised: #f0eee6;
  --line: #e3dfd2;
  --text: #141413;
  --muted: #6b6a60;
  --accent: #b5573a;
  --on-accent: #ffffff;
  --danger: #b53333;
  --scrim: rgba(20, 20, 19, .35);
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 400 16px/1.45 "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  min-height: 100dvh;
  padding-bottom: env(safe-area-inset-bottom);
}
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; padding: 22px 16px 40px; }

.top { padding: 6px 4px 18px; }
h1 {
  margin: 0;
  font: 500 36px/1.1 var(--serif);
  letter-spacing: -.015em;
}
#sub { margin: 8px 0 0; color: var(--muted); font-size: 15px; }

.tabs {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
  padding: 4px; border-radius: 16px; background: var(--raised);
  position: sticky; top: 8px; z-index: 2;
  box-shadow: 0 0 0 6px var(--bg);
}
.tabs button {
  position: relative; z-index: 1;
  background: transparent; color: var(--muted);
  height: 40px; border-radius: 12px; font-weight: 500; font-size: 14.5px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background .15s, color .15s;
}
.tabs button b { font-weight: 600; font-size: 12.5px; padding: 1px 7px; border-radius: 99px; background: color-mix(in oklab, var(--muted) 20%, transparent); }
.tabs button[aria-selected="true"] { color: var(--text); }
.tabs button[aria-selected="true"] b { background: var(--accent); color: var(--on-accent); }

/* плашка под активной вкладкой скользит */
.pill {
  position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 16px) / 3);
  border-radius: 12px; background: var(--surface); box-shadow: 0 1px 2px rgba(20, 20, 19, .12);
  transform: translateX(calc(var(--ti, 0) * (100% + 4px)));
  transition: transform .4s cubic-bezier(.3, 1.25, .4, 1);
}
.tabs button b { display: inline-block; }
.tabs b.bump { animation: bump .45s cubic-bezier(.3, 1.5, .5, 1); }

#list { display: grid; gap: 12px; margin-top: 18px; }
.bar { display: flex; justify-content: flex-end; }

/* маска-аватар: цвет зависит от человека, лица не видно */
.av {
  --c: hsl(var(--hue) 55% 60%);
  width: 44px; height: 44px; border-radius: 50%; flex: none;
  background: var(--c); display: grid; place-items: center;
}
.av svg { width: 30px; height: 30px; }
.av .m { fill: rgba(255, 255, 255, .95); }
.av .e { fill: var(--c); }

.msg {
  --c: hsl(var(--hue) 55% 58%);
  display: grid; grid-template-columns: 44px 1fr; gap: 12px;
  padding: 14px; border-radius: 22px;
  background: color-mix(in oklab, var(--c) 6%, var(--surface));
  border: 1px solid color-mix(in oklab, var(--c) 18%, var(--line));
}
/* ----- анимации ----- */
.top { animation: rise .55s cubic-bezier(.2, .8, .2, 1) backwards; }
.tabs { animation: rise .55s cubic-bezier(.2, .8, .2, 1) .08s backwards; }

.msg, .ban {
  transition: height .34s cubic-bezier(.4, 0, .2, 1), padding .34s cubic-bezier(.4, 0, .2, 1),
    margin .34s cubic-bezier(.4, 0, .2, 1), border-width .34s, opacity .26s, transform .34s cubic-bezier(.4, 0, .2, 1);
}
.leaving {
  height: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important;
  margin-bottom: -12px; border-width: 0; overflow: hidden; opacity: 0;
  transform: scale(.96); pointer-events: none;
}
.leaving.sent { transform: translateX(56px) scale(.96); }

.enter { animation: rise .5s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--i, 0) * 45ms); }
.msg.enter .av { animation: pop .55s cubic-bezier(.3, 1.5, .5, 1) backwards; animation-delay: calc(var(--i, 0) * 45ms + 140ms); }
.msg.fresh { animation: rise .5s cubic-bezier(.2, .8, .2, 1) backwards, glow 1.5s ease-out .35s backwards; }

.av.big { width: 84px; height: 84px; margin: 0 auto 18px; animation: float 4.5s ease-in-out infinite; }
.av.big svg { width: 58px; height: 58px; }
.av.big .e { transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; }
.av { cursor: pointer; }
.av.hop { animation: hop .55s cubic-bezier(.3, 1.4, .5, 1); }
.av.hop .e { transform-box: fill-box; transform-origin: center; animation: blink-once .4s; }

.skel { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 14px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); }
.skel .av { cursor: default; }
.skel .av, .skel i {
  background: linear-gradient(90deg, var(--raised) 30%, color-mix(in oklab, var(--raised) 50%, var(--surface)) 50%, var(--raised) 70%);
  background-size: 300% 100%; animation: shimmer 1.4s linear infinite;
}
.skel i { display: block; height: 12px; border-radius: 6px; margin: 6px 0 10px; }
.skel i:nth-child(2) { width: 72%; }
.skel i:nth-child(3) { width: 40%; }

@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes pop { from { transform: scale(.4) rotate(-14deg); opacity: 0; } }
@keyframes glow { from { box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 55%, transparent); } to { box-shadow: 0 0 0 12px transparent; } }
@keyframes bump { 40% { transform: scale(1.4); } }
@keyframes hop { 30% { transform: translateY(-7px) rotate(-9deg); } 62% { transform: translateY(0) rotate(5deg); } }
@keyframes blink { 0%, 90%, 100% { scale: 1 1; } 94% { scale: 1 .1; } }
@keyframes blink-once { 50% { scale: 1 .1; } }
@keyframes float { 50% { transform: translateY(-7px); } }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* ----- маскот Маська ----- */
.stage { position: relative; height: 46px; margin: -4px 0 6px; }
.walker {
  position: absolute; left: 0; bottom: 0; width: 44px; height: 40px; cursor: pointer;
  touch-action: manipulation; animation: stroll 26s ease-in-out infinite;
}
.face { width: 100%; height: 100%; animation: facing 26s step-end infinite; }
.jump { display: block; width: 44px; height: 40px; transform-origin: 50% 100%; }
.mascot { display: block; width: 44px; height: 40px; overflow: visible; }
.walker .mascot { animation: bob .52s ease-in-out infinite; }

.mascot .body, .mascot .ear, .mascot .tail { fill: var(--accent); }
.mascot .leg { fill: color-mix(in oklab, var(--accent) 78%, #000); transform-box: fill-box; transform-origin: 50% 10%; }
.mascot .mask { fill: #fff6ea; }
.mascot .eye { fill: #2b2620; }
.mascot .glint { fill: #fff; }
.mascot .mouth { fill: none; stroke: #2b2620; stroke-width: 1.4; stroke-linecap: round; }
.mascot .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
.mascot .tail { transform-box: fill-box; transform-origin: 100% 100%; animation: wag 1.8s ease-in-out infinite; }
.mascot .walk { opacity: 0; }
.mascot .walk .l1 { animation: step .52s ease-in-out infinite; }
.mascot .walk .l2 { animation: step .52s ease-in-out -.26s infinite; }
.walker .walk { animation: legsOn 26s step-end infinite; }
.walker .stand { animation: legsOff 26s step-end infinite; }

.heart { position: absolute; bottom: 38px; font-size: 16px; pointer-events: none; animation: heart 1.1s ease-out forwards; }

/* Маська сидит на поле ответа и смотрит, как ты печатаешь */
.field { position: relative; margin-top: 36px; }
.sit-wrap { position: absolute; right: 14px; bottom: 100%; margin-bottom: -2px; width: 44px; height: 40px; pointer-events: none; }
.typing .eyes { translate: 0 1.6px; }
.typing .jump { animation: type .4s ease-in-out infinite; }
.cheer .jump { animation: jump .7s cubic-bezier(.3, 1.2, .5, 1); }

@keyframes stroll { 0%, 7% { left: 0; } 47%, 53% { left: calc(100% - 44px); } 93%, 100% { left: 0; } }
@keyframes facing { 0% { transform: scaleX(1); } 50% { transform: scaleX(-1); } }
@keyframes legsOn { 0% { opacity: 0; } 7% { opacity: 1; } 47% { opacity: 0; } 53% { opacity: 1; } 93% { opacity: 0; } }
@keyframes legsOff { 0% { opacity: 1; } 7% { opacity: 0; } 47% { opacity: 1; } 53% { opacity: 0; } 93% { opacity: 1; } }
@keyframes step { 0%, 100% { transform: rotate(26deg); } 50% { transform: rotate(-26deg); } }
@keyframes bob { 50% { transform: translateY(-2px); } }
@keyframes wag { 50% { transform: rotate(-14deg); } }
@keyframes type { 50% { transform: translateY(-2px); } }
@keyframes jump { 25% { transform: translateY(-14px) scale(.94, 1.08); } 55% { transform: translateY(0) scale(1.08, .92); } }
@keyframes heart { from { opacity: 1; transform: translateY(0) scale(.7); } to { opacity: 0; transform: translateY(-38px) scale(1.15); } }

.meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.meta strong { font: 500 17px/1.3 var(--serif); }
.meta time { color: var(--muted); font-size: 13px; white-space: nowrap; }

.txt {
  margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 7; overflow: hidden;
}
.txt.can { cursor: pointer; }
.txt.can:not(.open) { -webkit-mask-image: linear-gradient(#000 78%, transparent); mask-image: linear-gradient(#000 78%, transparent); }
.txt.open { display: block; -webkit-mask-image: none; mask-image: none; }
.chip {
  display: inline-block; margin-top: 8px; padding: 2px 10px; border-radius: 99px;
  font-size: 13px; color: var(--muted); background: var(--raised);
}

.acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.btn {
  height: 48px; padding: 0 20px; border-radius: 14px; font-weight: 600;
  background: var(--raised); transition: transform .1s, opacity .15s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.loading::before {
  content: ""; display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px;
  border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite;
}
.btn.sm { height: 36px; padding: 0 14px; border-radius: 11px; font-size: 14.5px; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.danger { background: color-mix(in oklab, var(--danger) 12%, transparent); color: var(--danger); }
.btn.ghost { background: var(--raised); color: var(--text); }
.acts .danger { margin-left: auto; }

/* отвеченные */
.msg.done { background: var(--surface); border-color: var(--line); }
.msg.done .txt { color: var(--muted); -webkit-line-clamp: 3; font-size: 15px; }
.reply {
  margin-top: 10px; padding: 10px 12px; border-radius: 16px 16px 16px 6px;
  background: color-mix(in oklab, var(--accent) 13%, var(--surface));
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.reply small { display: block; margin-top: 4px; color: var(--muted); font-size: 12.5px; }

.ban { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); }
.ban .who { flex: 1; min-width: 0; }
.ban strong { display: block; font: 500 16.5px/1.3 var(--serif); }
.ban small { color: var(--muted); font-size: 13px; }

.empty { text-align: center; padding: 56px 24px; color: var(--muted); }
.empty h2 { margin: 0 0 8px; font: 500 24px/1.2 var(--serif); color: var(--text); }
.empty p { margin: 0 auto 18px; max-width: 30ch; }

/* окно ответа */
.sheet { position: fixed; inset: 0; z-index: 10; visibility: hidden; transition: visibility 0s linear .3s; }
.sheet.open { visibility: visible; transition-delay: 0s; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .3s; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.open .scrim { opacity: 1; }
.panel {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px;
  max-height: 90dvh; overflow: auto;
  background: var(--surface); border-radius: 28px 28px 0 0;
  padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform .3s cubic-bezier(.2, .8, .2, 1);
}
.open .panel { transform: none; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
.who { display: flex; align-items: center; gap: 12px; }
.who strong { display: block; font: 500 17px/1.3 var(--serif); }
.who small { color: var(--muted); font-size: 13px; }
#sh-q {
  margin: 14px 0 0; padding: 10px 14px; border-radius: 14px; background: var(--raised);
  color: var(--muted); font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere;
  max-height: 22dvh; overflow: auto;
}
#sh-text {
  display: block; width: 100%; padding: 14px; border-radius: 16px; resize: none;
  border: 1px solid var(--line); background: var(--bg); color: var(--text);
  font: inherit; min-height: 110px; max-height: 34dvh;
}
#sh-text:focus { border-color: var(--accent); outline: none; }
.row { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; margin-top: 12px; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 20;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 14px;
  background: var(--text); color: var(--bg); font-weight: 500; font-size: 15px;
  transition: opacity .2s, transform .45s cubic-bezier(.3, 1.4, .5, 1);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: var(--danger); color: #fff; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="stage" id="stage"><div class="walker"><div class="face"><div class="jump"></div></div></div></div>
    <h1>Анонимки</h1>
    <p id="sub">Загрузка…</p>
  </header>
  <nav class="tabs" role="tablist" aria-label="Разделы">
    <span class="pill" aria-hidden="true"></span>
    <button role="tab" data-tab="inbox" aria-selected="true">Новые <b id="n-inbox">0</b></button>
    <button role="tab" data-tab="answered" aria-selected="false">Отвечены <b id="n-answered">0</b></button>
    <button role="tab" data-tab="banned" aria-selected="false">Баны <b id="n-banned">0</b></button>
  </nav>
  <section id="list" aria-live="polite"></section>
</main>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="scrim" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sh-name">
    <div class="grab"></div>
    <div class="who">
      <span id="sh-av"></span>
      <div><strong id="sh-name"></strong><small id="sh-time"></small></div>
    </div>
    <blockquote id="sh-q"></blockquote>
    <div class="field">
      <span class="sit-wrap" id="sheet-mascot"><span class="jump"></span></span>
      <textarea id="sh-text" maxlength="3500" placeholder="Напиши ответ. Он придёт человеку от имени бота."></textarea>
    </div>
    <div class="row">
      <button class="btn ghost" data-close>Отмена</button>
      <button class="btn primary" id="sh-send" disabled>Отправить</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const root = document.documentElement;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ----- тема и Telegram -----
  const applyTheme = () => {
    const scheme = (tg && tg.colorScheme) || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    root.dataset.theme = scheme;
    try {
      const bg = getComputedStyle(root).getPropertyValue("--bg").trim();
      tg.setHeaderColor(bg);
      tg.setBackgroundColor(bg);
    } catch (e) {}
  };
  applyTheme();
  try { tg.onEvent("themeChanged", applyTheme); tg.ready(); tg.expand(); } catch (e) {}

  const tap = () => { try { tg.HapticFeedback.impactOccurred("light"); } catch (e) {} };
  const buzz = (t) => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
  const ask = (msg) => new Promise((res) => {
    if (tg && tg.showConfirm) tg.showConfirm(msg, res); else res(confirm(msg));
  });

  let toastTimer;
  function toast(msg, bad) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.toggle("bad", !!bad);
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  async function call(path, body) {
    const r = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: { "Authorization": "tma " + ((tg && tg.initData) || ""), "content-type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      const e = new Error(j.detail || j.error || "Ошибка " + r.status);
      e.status = r.status;
      throw e;
    }
    return j;
  }

  // ----- маскот Маська -----
  const MASCOT =
    '<svg class="mascot" viewBox="0 0 48 44" aria-hidden="true">' +
    '<path class="tail" d="M10 30c-6 1-9-5-7-11 4 2 8 4 10 8z"/>' +
    '<g class="stand"><rect class="leg" x="16" y="34" width="6" height="8" rx="3"/><rect class="leg" x="28" y="34" width="6" height="8" rx="3"/></g>' +
    '<g class="walk"><rect class="leg l1" x="16" y="34" width="6" height="8" rx="3"/><rect class="leg l2" x="28" y="34" width="6" height="8" rx="3"/></g>' +
    '<path class="ear" d="M14 18L12 6l11 8z"/><path class="ear" d="M36 18l2-12-11 8z"/>' +
    '<ellipse class="body" cx="25" cy="27" rx="16" ry="12"/>' +
    '<path class="mask" d="M12 24c4-6 10-7 14-7s11 1 15 7c-1 7-7 9-15 9s-13-2-14-9z"/>' +
    '<g class="eyes"><ellipse class="eye" cx="21" cy="25" rx="2.6" ry="3"/><ellipse class="eye" cx="32" cy="25" rx="2.6" ry="3"/>' +
    '<circle class="glint" cx="21.8" cy="24" r=".9"/><circle class="glint" cx="32.8" cy="24" r=".9"/></g>' +
    '<path class="mouth" d="M25 29.5q1.6 1.8 3.2 0"/></svg>';
  document.querySelectorAll(".jump").forEach((j) => { j.innerHTML = MASCOT; });

  const cheer = (el) => {
    if (!el) return;
    el.classList.remove("cheer");
    void el.offsetWidth;
    el.classList.add("cheer");
    setTimeout(() => el.classList.remove("cheer"), 800);
  };

  // тап по Маське: прыжок и сердечко
  $("#stage").addEventListener("click", (e) => {
    const w = e.target.closest(".walker");
    if (!w) return;
    tap();
    cheer($("#stage .jump"));
    const stage = $("#stage"), h = document.createElement("span");
    h.className = "heart";
    h.textContent = ["💛", "🧡", "🥺"][Math.floor(Math.random() * 3)];
    h.style.left = w.getBoundingClientRect().left - stage.getBoundingClientRect().left + 14 + "px";
    stage.appendChild(h);
    setTimeout(() => h.remove(), 1200);
  });

  // ----- состояние -----
  let S = { inbox: [], answered: [], banned: [], bot: "" };
  let tab = "inbox", loaded = false, didFirst = false, animAll = true, prevCounts = false;
  let current = null, busy = false, enterTimer;
  const seen = new Set();
  const TABS = ["inbox", "answered", "banned"];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const drafts = new Map();

  const ago = (ts) => {
    const s = Math.max(0, (Date.now() - ts) / 1000);
    if (s < 60) return "только что";
    const m = s / 60;
    if (m < 60) return Math.floor(m) + " мин назад";
    const h = m / 60;
    if (h < 24) return Math.floor(h) + " ч назад";
    return Math.floor(h / 24) + " дн назад";
  };

  const mask = (hue, cls = "") =>
    `<span class="av${cls}" style="--hue:${Number(hue) || 0}"><svg viewBox="0 0 40 40" aria-hidden="true">` +
    `<path class="m" d="M5 13.5C9.5 10 14.5 9 20 9s10.5 1 15 4.5c0 10-4.5 18-15 18S5 23.5 5 13.5z"/>` +
    `<ellipse class="e" cx="13.5" cy="18.5" rx="3.6" ry="2.3" transform="rotate(12 13.5 18.5)"/>` +
    `<ellipse class="e" cx="26.5" cy="18.5" rx="3.6" ry="2.3" transform="rotate(-12 26.5 18.5)"/>` +
    `</svg></span>`;

  // новые карточки появляются с анимацией, уже виденные нет
  const enterCls = (k) => (animAll ? " enter" : seen.has(k) ? "" : " enter fresh");
  const stag = (i) => (animAll ? Math.min(i, 8) : 0);

  const body = (m) => m.text
    ? `<p class="txt">${esc(m.text)}</p>${m.kind ? `<span class="chip">${esc(m.kind)}, смотри в чате с ботом</span>` : ""}`
    : `<span class="chip">${esc(m.kind || "Вложение")}, смотри в чате с ботом</span>`;

  const card = (m, i) => `
    <article class="msg${enterCls("i:" + m.id)}" data-id="${m.id}" style="--hue:${Number(m.hue) || 0};--i:${stag(i)}">
      ${mask(m.hue)}
      <div>
        <div class="meta"><strong>${esc(m.alias)}</strong><time data-ts="${m.created_at}">${ago(m.created_at)}</time></div>
        ${body(m)}
        <div class="acts">
          <button class="btn primary sm" data-act="reply" data-id="${m.id}">Ответить</button>
          <button class="btn ghost sm" data-act="del" data-id="${m.id}">Удалить</button>
          <button class="btn danger sm" data-act="ban" data-id="${m.id}">Забанить</button>
        </div>
      </div>
    </article>`;

  const doneCard = (m, i) => `
    <article class="msg done${enterCls("a:" + m.id)}" style="--hue:${Number(m.hue) || 0};--i:${stag(i)}">
      ${mask(m.hue)}
      <div>
        <div class="meta"><strong>${esc(m.alias)}</strong><time data-ts="${m.created_at}">${ago(m.created_at)}</time></div>
        ${m.text ? `<p class="txt">${esc(m.text)}</p>` : `<span class="chip">${esc(m.kind || "Вложение")}</span>`}
        <div class="reply">${esc(m.reply_text)}<small>Ответ ${ago(m.answered_at)}</small></div>
      </div>
    </article>`;

  const banRow = (b, i) => `
    <div class="ban${enterCls("b:" + b.id)}" data-id="${b.id}" style="--hue:${Number(b.hue) || 0};--i:${stag(i)}">
      ${mask(b.hue)}
      <div class="who"><strong>${esc(b.alias)}</strong><small>в бане с ${new Date(b.ts).toLocaleDateString("ru-RU")}</small></div>
      <button class="btn ghost sm" data-act="unban" data-id="${b.id}">Разбанить</button>
    </div>`;

  const empty = (title, text, btn) =>
    `<div class="empty enter" style="--i:0">${mask(18, " big")}<h2>${title}</h2><p>${text}</p>${btn || ""}</div>`;

  function render(all) {
    animAll = !!all;
    const n = S.inbox.length;
    $("#sub").textContent = !loaded ? "Загрузка…" : n ? "Ждут ответа: " + n : "Всё разобрано";
    const counts = { inbox: n, answered: S.answered.length, banned: S.banned.length };
    for (const k of TABS) {
      const el = $("#n-" + k);
      if (el.textContent !== String(counts[k])) {
        el.textContent = counts[k];
        if (prevCounts) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
      }
    }
    prevCounts = true;
    $(".tabs").style.setProperty("--ti", TABS.indexOf(tab));
    document.querySelectorAll(".tabs button").forEach((b) =>
      b.setAttribute("aria-selected", String(b.dataset.tab === tab)));

    let html = "";
    if (!loaded) {
      html = '<div class="skel"><span class="av sk"></span><div><i></i><i></i><i></i></div></div>'.repeat(3);
    } else if (tab === "inbox") {
      html = n
        ? S.inbox.map(card).join("")
        : empty("Пока тихо",
            "Когда кто-то напишет боту, сообщение появится здесь. Имя человека ты не увидишь.",
            S.bot ? `<button class="btn primary" data-act="share">Поделиться ботом</button>` : "");
    } else if (tab === "answered") {
      html = S.answered.length
        ? `<div class="bar"><button class="btn ghost sm" data-act="clear">Очистить отвеченные</button></div>` + S.answered.map(doneCard).join("")
        : empty("Ответов пока нет", "Здесь будут сообщения, на которые ты ответил. Через 7 дней они удалятся сами.");
    } else {
      html = S.banned.length
        ? S.banned.map(banRow).join("")
        : empty("Список пуст", "Забаненные люди больше не смогут писать боту.");
    }
    $("#list").innerHTML = html;
    document.querySelectorAll(".txt").forEach((el) => {
      if (el.scrollHeight > el.clientHeight + 2) el.classList.add("can");
    });
    S.inbox.forEach((m) => seen.add("i:" + m.id));
    S.answered.forEach((m) => seen.add("a:" + m.id));
    S.banned.forEach((b) => seen.add("b:" + b.id));
    clearTimeout(enterTimer);
    enterTimer = setTimeout(() => {
      document.querySelectorAll("#list .enter, #list .fresh").forEach((el) => el.classList.remove("enter", "fresh"));
    }, 1700);
  }

  async function load(silent) {
    try {
      const had = new Set(S.inbox.map((m) => m.id));
      const next = await call("/api/state");
      // ничего не изменилось: не перерисовываем список, только обновляем время
      if (didFirst && JSON.stringify(next) === JSON.stringify(S)) {
        document.querySelectorAll("time[data-ts]").forEach((t) => { t.textContent = ago(Number(t.dataset.ts)); });
        return;
      }
      S = next;
      loaded = true;
      if (didFirst && S.inbox.some((m) => !had.has(m.id))) { buzz("warning"); cheer($("#stage .jump")); }
      render(!didFirst);
      didFirst = true;
    } catch (e) {
      if (silent) return;
      $("#sub").textContent = "";
      $("#list").innerHTML = e.status === 401 || !(tg && tg.initData)
        ? empty("Только для владельца", "Открой приложение из бота в Telegram с аккаунта владельца.")
        : empty("Не удалось загрузить", esc(e.message), `<button class="btn primary" data-act="retry">Повторить</button>`);
    }
  }

  // карточка схлопывается, потом список обновляется
  function leave(ids, sent) {
    const els = ids
      .map((id) => document.querySelector(`#list .msg[data-id="${id}"], #list .ban[data-id="${id}"]`))
      .filter(Boolean);
    if (!els.length || reduce) return Promise.resolve();
    els.forEach((el) => {
      el.style.height = el.offsetHeight + "px";
      el.classList.remove("enter", "fresh");
    });
    void document.body.offsetWidth;
    els.forEach((el) => { el.classList.add("leaving"); if (sent) el.classList.add("sent"); });
    return new Promise((r) => setTimeout(r, 380));
  }

  // ----- окно ответа -----
  const sheet = $("#sheet"), ta = $("#sh-text"), sendBtn = $("#sh-send");
  const sheetOpen = () => sheet.classList.contains("open");

  function openSheet(id) {
    const m = S.inbox.find((x) => x.id === id);
    if (!m) return;
    current = m;
    $("#sh-av").innerHTML = mask(m.hue);
    $("#sh-name").textContent = m.alias;
    $("#sh-time").textContent = ago(m.created_at);
    $("#sh-q").textContent = m.text || m.kind || "Вложение";
    ta.value = drafts.get(id) || "";
    sendBtn.disabled = !ta.value.trim();
    sheet.classList.add("open");
    sheet.setAttribute("aria-hidden", "false");
    try { tg.BackButton.show(); } catch (e) {}
    setTimeout(() => ta.focus(), 280);
  }

  function closeSheet() {
    if (current) drafts.set(current.id, ta.value);
    sheet.classList.remove("open");
    sheet.setAttribute("aria-hidden", "true");
    ta.blur();
    try { tg.BackButton.hide(); } catch (e) {}
  }

  ta.addEventListener("input", () => { sendBtn.disabled = busy || !ta.value.trim(); });
  let typeTimer;
  ta.addEventListener("input", () => {
    const sit = $("#sheet-mascot");
    sit.classList.add("typing");
    clearTimeout(typeTimer);
    typeTimer = setTimeout(() => sit.classList.remove("typing"), 700);
  });
  sheet.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) closeSheet(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheetOpen()) closeSheet(); });
  try { tg.BackButton.onClick(closeSheet); } catch (e) {}

  sendBtn.addEventListener("click", async () => {
    const text = ta.value.trim();
    if (!text || !current || busy) return;
    busy = true;
    sendBtn.disabled = true;
    sendBtn.textContent = "Отправляю…";
    sendBtn.classList.add("loading");
    try {
      await call("/api/reply", { id: current.id, text });
      const sentId = current.id;
      drafts.delete(sentId);
      current = null;
      buzz("success");
      toast("Ответ отправлен");
      cheer($("#sheet-mascot .jump"));
      cheer($("#stage .jump"));
      closeSheet();
      await leave([sentId], true);
      await load(true);
    } catch (e) {
      buzz("error");
      toast(e.message, true);
    } finally {
      busy = false;
      sendBtn.textContent = "Отправить";
      sendBtn.classList.remove("loading");
      sendBtn.disabled = !ta.value.trim();
    }
  });

  // ----- клики по списку -----
  $("#list").addEventListener("click", async (e) => {
    const av = e.target.closest(".av");
    if (av && !av.closest(".skel")) {
      av.classList.remove("hop");
      void av.offsetWidth;
      av.classList.add("hop");
      tap();
      setTimeout(() => av.classList.remove("hop"), 650);
      return;
    }
    const txt = e.target.closest(".txt.can");
    if (txt) { txt.classList.toggle("open"); return; }
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const id = Number(b.dataset.id);
    tap();
    try {
      switch (b.dataset.act) {
        case "reply": openSheet(id); break;
        case "retry": load(); break;
        case "del":
          if (await ask("Удалить сообщение без ответа?")) {
            await call("/api/delete", { id });
            toast("Удалено");
            await leave([id]);
            await load(true);
          }
          break;
        case "ban":
          if (await ask("Забанить отправителя? Его сообщения удалятся, и писать боту он больше не сможет.")) {
            const m = S.inbox.find((x) => x.id === id);
            const ids = m ? S.inbox.filter((x) => x.alias === m.alias && x.hue === m.hue).map((x) => x.id) : [id];
            await call("/api/ban", { id });
            toast("Забанен");
            await leave(ids);
            await load(true);
          }
          break;
        case "unban":
          await call("/api/unban", { id });
          toast("Разбанен");
          await leave([id]);
          await load(true);
          break;
        case "clear":
          if (await ask("Удалить все отвеченные сообщения?")) {
            await call("/api/clear", {});
            toast("Очищено");
            await load(true);
          }
          break;
        case "share": {
          const link = "https://t.me/" + S.bot;
          const url = "https://t.me/share/url?url=" + encodeURIComponent(link) + "&text=" + encodeURIComponent("Напиши мне анонимно");
          if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
          break;
        }
      }
    } catch (err) {
      buzz("error");
      toast(err.message, true);
    }
  });

  document.querySelector(".tabs").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-tab]");
    if (!b || b.dataset.tab === tab) return;
    tap();
    tab = b.dataset.tab;
    render(true);
    scrollTo({ top: 0 });
  });

  // обновляем список, пока приложение открыто и окно ответа закрыто
  setInterval(() => { if (!document.hidden && !sheetOpen()) load(true); }, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !sheetOpen()) load(true); });

  render();
  load();
})();
</script>
</body>
</html>
